name: Run Jest Tests

on:
  pull_request:
    branches:
      - main
      - stage

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4

      - name: 🧪 Setup up Nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🚀 Install dependencies
        run: npm install

      - name: 🧪 Run tests
        run: npm test
